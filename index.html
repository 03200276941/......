<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>ID Card Guessing Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #4361ee;
      --primary-dark: #3a56d4;
      --primary-light: #edf2ff;
      --success-color: #4cc9f0;
      --success-dark: #2fb8e0;
      --error-color: #f72585;
      --error-dark: #e51778;
      --text-color: #2b2d42;
      --text-light: #6c757d;
      --light-gray: #f8f9fa;
      --gray: #e9ecef;
      --white: #ffffff;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.12);
      --border-radius: 16px;
      --card-border-radius: 12px;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      background-color: var(--light-gray);
      color: var(--text-color);
      line-height: 1.6;
      background-image: radial-gradient(circle at 10% 20%, rgba(67, 97, 238, 0.03) 0%, rgba(67, 97, 238, 0.03) 90%);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      gap: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 0.5rem;
      width: 100%;
      padding: 0 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 1rem;
      color: var(--text-color);
      font-weight: 700;
      position: relative;
      display: inline-block;
      letter-spacing: -0.5px;
    }

    h1::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-color), var(--success-color));
      border-radius: 4px;
    }

    .user-id-container {
      background-color: var(--white);
      padding: 0.8rem 1.5rem;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      margin-bottom: 0.5rem;
      display: inline-block;
      border: 1px solid var(--gray);
      font-size: 0.95rem;
      backdrop-filter: blur(4px);
      background-color: rgba(255, 255, 255, 0.9);
      position: relative;
      overflow: hidden;
      transition: var(--transition);
    }

    .user-id-container:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .user-id-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, var(--primary-color), var(--success-color));
    }

    #user-id {
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--primary-dark), var(--success-dark));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .game-instructions {
      background-color: var(--white);
      padding: 1rem;
      border-radius: var(--border-radius);
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: var(--text-light);
      text-align: center;
      max-width: 500px;
      box-shadow: var(--shadow);
      border: 1px solid var(--gray);
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
      width: 100%;
      margin: 0.5rem 0;
      padding: 0 0.5rem;
      max-height: 55vh;
      overflow: hidden;
    }

    .card {
      aspect-ratio: 3/4;
      border-radius: var(--card-border-radius);
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      box-shadow: var(--shadow);
      background-color: var(--white);
      border: 1px solid rgba(0,0,0,0.05);
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: var(--shadow-hover);
    }

    .card.revealed {
      transform: translateY(0) scale(1);
      box-shadow: var(--shadow);
      cursor: default;
    }

    .card.revealed:hover {
      transform: translateY(0) scale(1);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      transform: scale(0.95);
      transition: var(--transition);
      border-radius: var(--card-border-radius);
    }

    .card.revealed img {
      display: block;
      transform: scale(1);
      animation: reveal 0.5s ease forwards;
    }

    .card-id {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
      color: white;
      padding: 1rem 0.5rem 0.5rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.85rem;
      transform: translateY(100%);
      transition: var(--transition);
      border-bottom-left-radius: var(--card-border-radius);
      border-bottom-right-radius: var(--card-border-radius);
      backdrop-filter: blur(2px);
    }

    .card.revealed .card-id {
      transform: translateY(0);
    }

    @keyframes reveal {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: var(--white);
      font-weight: 600;
      padding: 1.5rem;
      text-align: center;
      transition: var(--transition);
      backface-visibility: hidden;
      font-size: 0.95rem;
      border-radius: var(--card-border-radius);
    }

    .placeholder::before {
      content: "?";
      font-size: 2.5rem;
      margin-bottom: 1rem;
      font-weight: 700;
      opacity: 0.8;
      background: rgba(255, 255, 255, 0.2);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: var(--transition);
    }

    .card:hover .placeholder::before {
      transform: scale(1.1);
    }

    .card.revealed .placeholder {
      opacity: 0;
      pointer-events: none;
      transform: rotateY(180deg);
    }

    #result {
      margin: 1rem 0;
      font-size: 1.05rem;
      font-weight: 600;
      text-align: center;
      min-height: 1.5rem;
      padding: 1.25rem;
      border-radius: var(--border-radius);
      width: 100%;
      max-width: 100%;
      box-shadow: var(--shadow);
      transition: var(--transition);
      opacity: 0;
      transform: translateY(10px);
      margin-top: auto;
      backdrop-filter: blur(4px);
      background-color: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(0,0,0,0.05);
    }

    #result.show {
      opacity: 1;
      transform: translateY(0);
    }

    .success {
      background: linear-gradient(135deg, rgba(76, 201, 240, 0.1), rgba(76, 201, 240, 0.05));
      color: var(--success-dark);
      border: 1px solid rgba(76, 201, 240, 0.3);
    }

    .error {
      background: linear-gradient(135deg, rgba(247, 37, 133, 0.08), rgba(247, 37, 133, 0.04));
      color: var(--error-dark);
      border: 1px solid rgba(247, 37, 133, 0.2);
    }

    #restart-btn {
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: var(--white);
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
      margin: 0.5rem 0;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
      width: auto;
      min-width: 180px;
    }

    #restart-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(67, 97, 238, 0.4);
    }

    #restart-btn:active {
      transform: translateY(0);
    }

    #restart-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: 0.5s;
    }

    #restart-btn:hover::before {
      left: 100%;
    }

    /* Footer styles */
    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-light);
      padding: 1rem;
      width: 100%;
    }

    footer p {
      margin: 0.25rem 0;
    }

    .footer-highlight {
      color: var(--primary-dark);
      font-weight: 600;
    }

    /* Confetti effect */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background-color: #f00;
      opacity: 0;
      animation: confetti 3s ease-in-out forwards;
      z-index: 1000;
    }

    @keyframes confetti {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Loading animation */
    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.6; transform: scale(0.98); }
    }

    /* Landscape orientation adjustments */
    @media (orientation: landscape) {
      body {
        padding: 1.5rem;
      }
      
      .cards-container {
        grid-template-columns: repeat(4, 1fr);
        max-height: 65vh;
        gap: 1.5rem;
      }
      
      .card {
        aspect-ratio: 3/4;
      }
      
      h1 {
        font-size: 1.5rem;
      }
    }

    /* Tablet and larger screens */
    @media (min-width: 768px) {
      h1 {
        font-size: 2rem;
      }
      
      .user-id-container {
        padding: 1rem 2rem;
      }
      
      #user-id {
        font-size: 1.1rem;
      }
      
      .cards-container {
        grid-template-columns: repeat(4, 1fr);
        max-width: 900px;
      }
      
      #result {
        font-size: 1.1rem;
        padding: 1.5rem;
      }
      
      #restart-btn {
        padding: 1.1rem 2.2rem;
        font-size: 1.05rem;
      }
    }

    /* Small devices in portrait */
    @media (max-width: 360px) and (orientation: portrait) {
      body {
        padding: 1.5rem 0.5rem;
      }
      
      h1 {
        font-size: 1.4rem;
      }
      
      .user-id-container {
        padding: 0.7rem 1.2rem;
        font-size: 0.85rem;
      }
      
      #user-id {
        font-size: 0.9rem;
      }
      
      .placeholder {
        font-size: 0.85rem;
        padding: 1rem;
      }
      
      .placeholder::before {
        font-size: 2rem;
        width: 50px;
        height: 50px;
        margin-bottom: 0.75rem;
      }
      
      #restart-btn {
        padding: 0.9rem 1.5rem;
        font-size: 0.9rem;
        min-width: 160px;
      }
      
      footer {
        font-size: 0.8rem;
      }
    }

    /* Tall devices (common for modern smartphones) */
    @media (min-height: 700px) and (orientation: portrait) {
      .cards-container {
        max-height: 60vh;
      }
    }

    /* Very tall devices */
    @media (min-height: 800px) and (orientation: portrait) {
      .cards-container {
        max-height: 65vh;
      }
      
      .container {
        gap: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ID Card Guessing Game</h1>
      <div class="user-id-container">
        <p>Your ID is: <strong><span id="user-id"></span></strong></p>
      </div>
      <div class="game-instructions">
        Find the card with your ID to win! Tap any card to reveal it.
      </div>
    </header>

    <div class="cards-container" id="cards-container"></div>

    <div id="result"></div>

    <button id="restart-btn">Play Again</button>
    
    <footer>
      <p>Created by <span class="footer-highlight">Muhammad Bakhtawar Khan</span></p>
      <p>Student at SMIT | Trainer: <span class="footer-highlight">Sir Ahmed Ashraf</span></p>
    </footer>
  </div>

  <script>
    const currentUserId = "user_123";
    document.getElementById("user-id").textContent = currentUserId;

    const cards = [
      {
        image_url: "https://t3.ftcdn.net/jpg/02/03/15/34/360_F_203153438_6tvdEUB2Nw9K0pubP6GAk7TjSIKlLorI.jpg",
        user_id: "user_456"
      },
      {
        image_url: "https://t4.ftcdn.net/jpg/05/81/62/43/360_F_581624354_jSvAOYRDCXyKfj8klz66T3u5u8UrOaiH.jpg",
        user_id: "user_123"
      },
      {
        image_url: "https://www.shutterstock.com/image-illustration/indian-flag-full-hd-wallpaper-600nw-2022311843.jpg",
        user_id: "user_789"
      },
      {
        image_url: "https://m.media-amazon.com/images/I/61bBOlCl3TL.jpg",
        user_id: "user_101"
      }
    ];

    const cardsContainer = document.getElementById("cards-container");
    const resultDisplay = document.getElementById("result");

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function createConfetti() {
      const colors = ['#4361ee', '#4cc9f0', '#f72585', '#7209b7', '#3a0ca3'];
      for (let i = 0; i < 100; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.width = Math.random() * 10 + 5 + 'px';
        confetti.style.height = Math.random() * 10 + 5 + 'px';
        confetti.style.animationDelay = Math.random() * 2 + 's';
        document.body.appendChild(confetti);
        
        // Remove confetti after animation
        setTimeout(() => {
          confetti.remove();
        }, 3000);
      }
    }

    function revealAllCards() {
      const allCards = document.querySelectorAll('.card');
      allCards.forEach(card => {
        card.classList.add('revealed');
        const img = card.querySelector('img');
        img.style.display = 'block';
      });
    }

    function renderCards() {
      cardsContainer.innerHTML = "";
      resultDisplay.textContent = "";
      resultDisplay.className = "";
      resultDisplay.classList.remove("show");

      shuffle(cards);

      cards.forEach(card => {
        const cardElement = document.createElement("div");
        cardElement.className = "card";

        const img = document.createElement("img");
        img.src = card.image_url;
        img.alt = "ID Card Image";
        img.loading = "lazy";

        const placeholder = document.createElement("div");
        placeholder.className = "placeholder";
        placeholder.textContent = "Tap to reveal";

        const cardIdElement = document.createElement("div");
        cardIdElement.className = "card-id";
        cardIdElement.textContent = `ID: ${card.user_id}`;

        cardElement.appendChild(img);
        cardElement.appendChild(placeholder);
        cardElement.appendChild(cardIdElement);

        cardElement.addEventListener("click", () => {
          if (cardElement.classList.contains('revealed')) return;
          
          cardElement.classList.add('revealed');
          img.style.display = "block";
          revealAllCards();

          if (card.user_id === currentUserId) {
            resultDisplay.textContent = "🎉 You win! That was your ID card!";
            resultDisplay.classList.add("success");
            createConfetti();
          } else {
            resultDisplay.textContent = "❌ Wrong guess. Try again!";
            resultDisplay.classList.add("error");
          }
          
          resultDisplay.classList.add("show");
          
          // Scroll to result if needed
          resultDisplay.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        cardsContainer.appendChild(cardElement);
      });
    }

    document.getElementById("restart-btn").addEventListener("click", () => {
      renderCards();
      // Small bounce animation on button click
      const btn = document.getElementById("restart-btn");
      btn.style.transform = "translateY(0)";
      setTimeout(() => {
        btn.style.transform = "translateY(-3px)";
      }, 100);
      setTimeout(() => {
        btn.style.transform = "translateY(0)";
      }, 200);
    });

    // Initial render
    renderCards();
    
    // Prevent zooming on double-tap
    document.addEventListener('dblclick', function(e) {
      e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
